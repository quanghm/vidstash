[project]
name = "vidstash"
version = "0.1.0"
description = "Local yt-dlp daemon driven by a browser extension."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "yt-dlp>=2024.1.1",
]

[project.scripts]
vidstash = "vidstash.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vidstash*"]
